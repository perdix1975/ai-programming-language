name: CI

on:
  push:
    branches: ["main", "bootstrap/**", "feature/**", "test/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Test
        run: pytest -q
      - name: Verify examples
        run: |
          apl verify examples/hello.apl
          apl verify examples/functions_if.apl
          apl verify examples/arithmetic.apl
          apl verify examples/repeat_factorial.apl
          apl verify examples/arrays.apl
          apl verify examples/records.apl
          apl verify examples/trap.apl
          apl verify examples/effects.apl
          apl verify examples/host_io.apl
          apl verify examples/limits.apl
          apl verify examples/contracts.apl
          apl verify examples/contracts_fail.apl
          apl verify examples/ranges.apl
          apl verify examples/ranges_fail.apl
          apl verify examples/quantities.apl
          apl verify examples/invariants.apl
          apl verify examples/invariants_fail.apl
      - name: Lower and verify normalized compiler LIR
        run: |
          for example in \
            hello \
            functions_if \
            arithmetic \
            repeat_factorial \
            arrays \
            records \
            trap \
            effects \
            host_io \
            limits \
            contracts \
            ranges \
            quantities \
            invariants
          do
            apl lower "examples/$example.apl" > "/tmp/$example.lir.json"
            apl verify-lir "/tmp/$example.lir.json"
          done
          test -n "$(apl lower-hash examples/invariants.apl)"
      - name: Compile and execute WebAssembly scalar backend
        run: |
          apl verify examples/wasm_scalar.apl
          apl compile-wasm examples/wasm_scalar.apl /tmp/wasm_scalar.wasm
          apl compile-wasm examples/wasm_mul.apl /tmp/wasm_mul.wasm
          apl compile-wasm examples/wasm_if.apl /tmp/wasm_if.wasm
          apl compile-wasm examples/wasm_repeat.apl /tmp/wasm_repeat.wasm
          apl compile-wasm examples/wasm_steps_ok.apl /tmp/wasm_steps_ok.wasm
          apl compile-wasm examples/contracts.apl /tmp/contracts.wasm
          apl compile-wasm examples/ranges.apl /tmp/ranges.wasm
          apl compile-wasm examples/quantities.apl /tmp/quantities.wasm
          apl compile-wasm examples/invariants.apl /tmp/invariants.wasm
          node - <<'NODE'
          const fs = require("fs");
          const bytes = fs.readFileSync("/tmp/wasm_scalar.wasm");
          const imports = {
            apl: {
              trap(code) {
                throw new Error(`APL WASM trap ${code}`);
              }
            }
          };
          async function run(path) {
            const {instance} = await WebAssembly.instantiate(
              fs.readFileSync(path),
              imports
            );
            return instance.exports.apl_entry();
          }
          Promise.all([
            run("/tmp/wasm_scalar.wasm"),
            run("/tmp/wasm_mul.wasm"),
            run("/tmp/wasm_if.wasm"),
            run("/tmp/wasm_repeat.wasm"),
            run("/tmp/wasm_steps_ok.wasm"),
            run("/tmp/contracts.wasm"),
            run("/tmp/ranges.wasm"),
            run("/tmp/quantities.wasm"),
            run("/tmp/invariants.wasm")
          ]).then(([addValue, mulValue, ifValue, repeatValue, stepsValue, contractValue, rangeValue, quantityValue, invariantValue]) => {
            if (addValue !== 42n) {
              throw new Error(`expected add 42n, got ${addValue}`);
            }
            if (mulValue !== 42n) {
              throw new Error(`expected mul 42n, got ${mulValue}`);
            }
            if (ifValue !== 42n) {
              throw new Error(`expected if/call 42n, got ${ifValue}`);
            }
            if (repeatValue !== 120n) {
              throw new Error(`expected repeat 120n, got ${repeatValue}`);
            }
            if (stepsValue !== 42n) {
              throw new Error(`expected step-budget result 42n, got ${stepsValue}`);
            }
            if (contractValue !== 6n) {
              throw new Error(`expected contracts 6n, got ${contractValue}`);
            }
            if (rangeValue !== 42n) {
              throw new Error(`expected ranges 42n, got ${rangeValue}`);
            }
            if (quantityValue !== 5n) {
              throw new Error(`expected quantities 5n, got ${quantityValue}`);
            }
            if (invariantValue !== 5n) {
              throw new Error(`expected invariants 5n, got ${invariantValue}`);
            }
          });
          NODE

      - name: Execute WebAssembly strings and deterministic host effects
        run: |
          apl compile-wasm examples/wasm_string_eq.apl /tmp/wasm_string_eq.wasm
          apl compile-wasm examples/effects.apl /tmp/effects.wasm
          apl compile-wasm examples/host_io.apl /tmp/host_io.wasm
          apl compile-wasm examples/arrays.apl /tmp/arrays.wasm
          apl compile-wasm examples/records.apl /tmp/records.wasm
          apl compile-wasm examples/wasm_struct_eq.apl /tmp/wasm_struct_eq.wasm
          apl compile-wasm examples/trap.apl /tmp/application_trap.wasm
          apl compile-wasm examples/wasm_output_limit_fail.apl /tmp/wasm_output_limit_fail.wasm
          apl compile-wasm examples/wasm_host_read_limit_fail.apl /tmp/wasm_host_read_limit_fail.wasm
          apl compile-wasm examples/wasm_array_oob.apl /tmp/wasm_array_oob.wasm
          node - <<'NODE'
          const {instantiateAplWasm} = require("./tests/wasm_runtime.js");

          async function expectTrap(path, grants, expectedCode, options = {}) {
            const runtime = await instantiateAplWasm(path, {
              grants,
              ...options,
            });
            try {
              runtime.instance.exports.apl_entry();
            } catch (err) {
              if (runtime.state.trapCode !== expectedCode) {
                throw new Error(
                  `expected trap ${expectedCode}, got ${runtime.state.trapCode}: ${err}`
                );
              }
              return;
            }
            throw new Error(`expected compiled trap ${expectedCode}`);
          }

          (async () => {
            const strings = await instantiateAplWasm("/tmp/wasm_string_eq.wasm");
            const same = strings.instance.exports.apl_entry();
            if (same !== 1) {
              throw new Error(`expected UTF-8 string equality true, got ${same}`);
            }

            const effects = await instantiateAplWasm("/tmp/effects.wasm", {
              grants: ["console.write"],
            });
            const effectResult = effects.instance.exports.apl_entry();
            if (effectResult !== 42n) {
              throw new Error(`expected effects result 42n, got ${effectResult}`);
            }
            if (effects.state.output.join("\n") !== "hello from APL") {
              throw new Error(`unexpected compiled output: ${effects.state.output}`);
            }

            const host = await instantiateAplWasm("/tmp/host_io.wasm", {
              grants: ["console.write", "fs.read_text", "net.get_text"],
              files: {"/message.txt": "local fixture"},
              network: {"https://example.test/message": "network fixture"},
            });
            const hostResult = host.instance.exports.apl_entry();
            const hostText = host.decodeString(hostResult);
            if (hostText !== "local fixture") {
              throw new Error(`expected local fixture return, got ${hostText}`);
            }
            if (host.state.output.join("\n") !== "local fixture\nnetwork fixture") {
              throw new Error(`unexpected host output: ${host.state.output}`);
            }

            const arrays = await instantiateAplWasm("/tmp/arrays.wasm");
            const arrayResult = arrays.instance.exports.apl_entry();
            if (arrayResult !== 23n || arrays.state.output.join("\n") !== "23") {
              throw new Error(
                `unexpected compiled array result/output: ${arrayResult} / ${arrays.state.output}`
              );
            }

            const records = await instantiateAplWasm("/tmp/records.wasm");
            const recordResult = records.instance.exports.apl_entry();
            if (recordResult !== 37n || records.state.output.join("\n") !== "37") {
              throw new Error(
                `unexpected compiled record result/output: ${recordResult} / ${records.state.output}`
              );
            }

            const structuredEquality = await instantiateAplWasm(
              "/tmp/wasm_struct_eq.wasm"
            );
            const structEqual = structuredEquality.instance.exports.apl_entry();
            if (structEqual !== 1) {
              throw new Error(
                `expected nested structural equality true, got ${structEqual}`
              );
            }

            const explicitTrap = await instantiateAplWasm(
              "/tmp/application_trap.wasm"
            );
            try {
              explicitTrap.instance.exports.apl_entry();
              throw new Error("expected application trap");
            } catch (err) {
              if (
                err.aplCode !== "app.demo"
                || err.aplMessage !== "demonstration trap"
                || err.aplWhere !== "main[0]"
              ) {
                throw err;
              }
            }

            const denied = await instantiateAplWasm("/tmp/effects.wasm");
            try {
              denied.instance.exports.apl_entry();
              throw new Error("expected capability denial");
            } catch (err) {
              if (err.aplCode !== "apl.capability_denied") throw err;
            }

            await expectTrap(
              "/tmp/wasm_output_limit_fail.wasm",
              ["console.write"],
              5
            );
            const unavailable = await instantiateAplWasm(
              "/tmp/wasm_host_read_limit_fail.wasm",
              {
                grants: ["fs.read_text"],
                hostAvailable: false,
              }
            );
            try {
              unavailable.instance.exports.apl_entry();
              throw new Error("expected host unavailable before host-read budget");
            } catch (err) {
              if (err.aplCode !== "apl.host_unavailable") throw err;
            }

            const missing = await instantiateAplWasm("/tmp/host_io.wasm", {
              grants: ["console.write", "fs.read_text", "net.get_text"],
              files: {},
              network: {"https://example.test/message": "network fixture"},
            });
            try {
              missing.instance.exports.apl_entry();
              throw new Error("expected missing host resource");
            } catch (err) {
              if (err.aplCode !== "apl.host_resource_missing") throw err;
            }

            await expectTrap(
              "/tmp/wasm_host_read_limit_fail.wasm",
              ["fs.read_text"],
              5,
              {files: {"/message.txt": "unused"}}
            );
            await expectTrap(
              "/tmp/wasm_array_oob.wasm",
              [],
              10
            );
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Enforce WebAssembly scalar trap ABI
        run: |
          apl compile-wasm examples/wasm_overflow.apl /tmp/wasm_overflow.wasm
          apl compile-wasm examples/wasm_mul_overflow.apl /tmp/wasm_mul_overflow.wasm
          apl compile-wasm examples/wasm_divzero.apl /tmp/wasm_divzero.wasm
          apl compile-wasm examples/wasm_repeat_negative.apl /tmp/wasm_repeat_negative.wasm
          apl compile-wasm examples/wasm_repeat_exceeds.apl /tmp/wasm_repeat_exceeds.wasm
          apl compile-wasm examples/wasm_steps_fail.apl /tmp/wasm_steps_fail.wasm
          apl compile-wasm examples/contracts_fail.apl /tmp/contracts_fail.wasm
          apl compile-wasm examples/ranges_fail.apl /tmp/ranges_fail.wasm
          apl compile-wasm examples/invariants_fail.apl /tmp/invariants_fail.wasm
          node - <<'NODE'
          const fs = require("fs");
          async function trapCode(path) {
            let seen = null;
            const imports = {
              apl: {
                trap(code) {
                  seen = code;
                  throw new Error("APL trap");
                }
              }
            };
            try {
              const {instance} = await WebAssembly.instantiate(
                fs.readFileSync(path),
                imports
              );
              instance.exports.apl_entry();
            } catch (err) {
              if (seen === null) throw err;
              return seen;
            }
            throw new Error("expected compiled APL trap");
          }
          Promise.all([
            trapCode("/tmp/wasm_overflow.wasm"),
            trapCode("/tmp/wasm_mul_overflow.wasm"),
            trapCode("/tmp/wasm_divzero.wasm"),
            trapCode("/tmp/wasm_repeat_negative.wasm"),
            trapCode("/tmp/wasm_repeat_exceeds.wasm"),
            trapCode("/tmp/wasm_steps_fail.wasm"),
            trapCode("/tmp/contracts_fail.wasm"),
            trapCode("/tmp/ranges_fail.wasm"),
            trapCode("/tmp/invariants_fail.wasm")
          ]).then(([overflow, mulOverflow, divzero, repeatNegative, repeatExceeds, stepsExhausted, preconditionFailed, rangeFailed, invariantFailed]) => {
            if (overflow !== 1) {
              throw new Error(`expected overflow trap 1, got ${overflow}`);
            }
            if (mulOverflow !== 1) {
              throw new Error(`expected mul overflow trap 1, got ${mulOverflow}`);
            }
            if (divzero !== 2) {
              throw new Error(`expected divzero trap 2, got ${divzero}`);
            }
            if (repeatNegative !== 3) {
              throw new Error(`expected repeat-negative trap 3, got ${repeatNegative}`);
            }
            if (repeatExceeds !== 4) {
              throw new Error(`expected repeat-exceeds trap 4, got ${repeatExceeds}`);
            }
            if (stepsExhausted !== 5) {
              throw new Error(`expected steps trap 5, got ${stepsExhausted}`);
            }
            if (preconditionFailed !== 6) {
              throw new Error(`expected precondition trap 6, got ${preconditionFailed}`);
            }
            if (rangeFailed !== 9) {
              throw new Error(`expected range trap 9, got ${rangeFailed}`);
            }
            if (invariantFailed !== 8) {
              throw new Error(`expected invariant trap 8, got ${invariantFailed}`);
            }
          });
          NODE

      - name: Verify optimizer and interpreter-WASM differential equivalence
        run: |
          apl optimize examples/wasm_scalar.apl > /tmp/wasm_scalar.optimized.lir.json
          apl verify-lir /tmp/wasm_scalar.optimized.lir.json
          apl optimize-lir /tmp/wasm_scalar.optimized.lir.json > /tmp/wasm_scalar.optimized2.lir.json
          cmp /tmp/wasm_scalar.optimized.lir.json /tmp/wasm_scalar.optimized2.lir.json
          python tests/run_differential.py

      - name: Run successful examples
        run: |
          output="$(apl run examples/hello.apl)"
          test "$output" = $'42\n[return i64] 42'
          output="$(apl run examples/functions_if.apl)"
          test "$output" = $'42\n[return i64] 42'
          output="$(apl run examples/arithmetic.apl)"
          test "$output" = $'-2\n-1\ntrue\n[return i64] -2'
          output="$(apl run examples/repeat_factorial.apl)"
          test "$output" = $'120\n[return i64] 120'
          output="$(apl run examples/arrays.apl)"
          test "$output" = $'23\n[return i64] 23'
          output="$(apl run examples/records.apl)"
          test "$output" = $'37\n[return i64] 37'
          output="$(apl run examples/effects.apl --allow console.write)"
          test "$output" = $'hello from APL\n[return i64] 42'
          output="$(apl run examples/host_io.apl --allow console.write --allow fs.read_text --allow net.get_text --host-fixture examples/host_fixture.json)"
          test "$output" = $'local fixture\nnetwork fixture\n[return string] local fixture'
          output="$(apl run examples/limits.apl)"
          test "$output" = '[return i64] 42'
          output="$(apl run examples/quantities.apl)"
          test "$output" = '[return i64] 5'
          output="$(apl run examples/invariants.apl)"
          test "$output" = '[return i64] 5'
          output="$(apl run examples/contracts.apl)"
          test "$output" = '[return i64] 6'
          output="$(apl run examples/ranges.apl)"
          test "$output" = '[return i64] 42'
      - name: Run explicit trap example
        run: |
          set +e
          output="$(apl run examples/trap.apl)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = 'APL error: [app.demo] main[0]: demonstration trap'
      - name: Enforce capability denial
        run: |
          set +e
          output="$(apl run examples/effects.apl)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = "APL error: [apl.capability_denied] <module>: missing capability grants: ['console.write']"
      - name: Enforce deterministic host presence
        run: |
          set +e
          output="$(apl run examples/host_io.apl --allow console.write --allow fs.read_text --allow net.get_text)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = "APL error: [apl.host_unavailable] main[2]: host interface is required for 'fs.read_text'"
      - name: Enforce host-tightened step budget
        run: |
          set +e
          output="$(apl run examples/limits.apl --max-steps 1)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = 'APL error: [apl.resource_limit] main[1]: steps resource limit exhausted'
      - name: Enforce function preconditions
        run: |
          set +e
          output="$(apl run examples/contracts_fail.apl)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = "APL error: [apl.precondition_failed] main.requires[0]: contract 'enabled' failed: demonstration precondition failed"

      - name: Enforce range refinements
        run: |
          set +e
          output="$(apl run examples/ranges_fail.apl)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = 'APL error: [apl.range_violation] main[1]: value 101 is outside range [0, 100]'

      - name: Enforce reusable invariant checks
        run: |
          set +e
          output="$(apl run examples/invariants_fail.apl)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = "APL error: [apl.invariant_failed] main[1]: invariant 'positive' failed: x must be positive"
