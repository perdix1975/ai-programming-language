[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apl-ai-language"
version = "0.0.5"
description = "Reference implementation for APL — AI Programming Language"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "APL Project"}]

[project.scripts]
apl = "apl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
